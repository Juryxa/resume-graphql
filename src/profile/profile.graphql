scalar JSON
scalar Date

type Profile{
    name:        String!
    description: String!
    githubUrl:   String!
    linkedinUrl: String
    otherLinks:  JSON
    projects:       [Project!]!
    skills:         [Skill!]!
    workExperience: [WorkExperience!]!
}

type Project{
    name:        String!
    description: String!
    sourceUrl:   String!
    demoUrl:     String
    profile:     Profile!
}

type Skill{
    name:      String!
    category:  String!
    profile:   Profile!
}

type WorkExperience{
    company:      String!
    position:     String!
    startDate:    Date!
    endDate:      Date!
    achievements: String!
    profile:      Profile!
}

type Query{
    profile: Profile!
    skills: [Skill!]!
    experience: [WorkExperience!]!
    projects: [Project!]!
}